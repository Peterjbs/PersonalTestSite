<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Creator Grind Challenge Grid</title>
    <link rel="stylesheet" href="styles/game.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">Creator Grind</div>
      <div class="goal">Goal: 15 Subscribers · $7,500 Pledges</div>
    </header>

    <section class="hud">
      <div class="meter" id="subscriber-meter">
        <span class="label">Subscribers</span>
        <span class="value" id="subscriber-count">0</span>
      </div>
      <div class="meter" id="pledge-meter">
        <span class="label">Pledges</span>
        <span class="value" id="pledge-total">$0</span>
      </div>
      <div class="meter" id="trust-meter">
        <span class="label">Fan Trust</span>
        <div class="trust-bar">
          <div class="trust-fill" id="trust-fill" style="width: 100%"></div>
        </div>
      </div>
      <div class="meter" id="streak-meter">
        <span class="label">Streak</span>
        <span class="value" id="streak-count">0x</span>
      </div>
    </section>

    <section class="ticker" id="dm-ticker">
      <span class="prefix">DMs</span>
      <span class="message" id="ticker-message">Loading inbox…</span>
    </section>

    <main class="grid" id="prospect-grid"></main>

    <aside class="events" id="event-feed">
      <h2>Live Feed</h2>
      <ul id="event-list"></ul>
    </aside>

    <div class="modal hidden" id="challenge-modal" role="dialog" aria-modal="true">
      <div class="modal-card" id="modal-card">
        <button class="close" id="modal-close" aria-label="Close">×</button>
        <div id="modal-content"></div>
      </div>
    </div>

    <script src="scripts/game.js" type="module"></script>
  </body>
</html>
